services:
  backend:
    build: .
    container_name: activation-system
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
    command: sh -c "npm run build:wallet && npm start"

  # Шлюз партнёрских сетей (Paynet UWS). Тот же код и та же база, но наружу
  # открыты ТОЛЬКО роуты /api/payments/uws/* — поток из терминалов не делит
  # процесс с кошельком и перезапускается независимо.
  uws:
    build: .
    container_name: activation-uws
    restart: always
    env_file:
      - .env
    environment:
      UWS_PORT: 4010
    depends_on:
      - db
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:4010:4010"
    command: sh -c "node uws-server.js"

  studio:
    build: .
    container_name: activation-studio
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5557:5555"
    command: sh -c "npx prisma studio --port 5555 --browser none"

  db:
    image: postgres:16
    container_name: activation-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: activation_system
    ports:
      - "127.0.0.1:7440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
